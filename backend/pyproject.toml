[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hippo"
version = "0.1.0"
description = "Assistant IA d'écoconception des parcours de soins (prototype hackathon AI for Health)"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["hippo*"]

[tool.setuptools.package-data]
hippo = ["data/*.json", "action_plan/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
